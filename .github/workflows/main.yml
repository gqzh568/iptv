name: Generate playlist manually
on:
  workflow_dispatch:
  schedule:
    - cron: '0 19 * * *'   # UTC 19点 = 北京时间 03:00

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release_meta.outputs.tag }}
      release_title: ${{ steps.release_meta.outputs.title }}
      source_sha: ${{ github.sha }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run IPTV generator
        run: python main.py

      - name: Generate release metadata
        id: release_meta
        run: |
          tag="playlist-$(date +%Y%m%d-%H%M%S-utc-plus-0800)"
          title="IPTV Playlist $tag"
          echo "tag=$tag" >> $GITHUB_OUTPUT
          echo "title=$title" >> $GITHUB_OUTPUT

      - name: Prepare public release assets & pages site
        id: assets
        run: |
          mkdir -p release-assets pages-site
          cp *.m3u *.txt *.jsonl *.log release-assets/ || true
          cp index.html result.m3u pages-site/ || true
          echo "final_file=pages-site/result.m3u" >> $GITHUB_OUTPUT

      - name: Delete zero-size files before upload
        run: |
          find release-assets -maxdepth 1 -type f -size 0c -delete

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: playlist-assets-${{ steps.release_meta.outputs.tag }}
          path: release-assets
          if-no-files-found: ignore
          retention-days: 1

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-site

  deploy-pages:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  publish-release:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: playlist-assets-${{ needs.generate.outputs.tag }}
          path: release-assets

      - name: Publish playlist release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.generate.outputs.tag }}
          RELEASE_TITLE: ${{ needs.generate.outputs.release_title }}
          SOURCE_SHA: ${{ needs.generate.outputs.source_sha }}
        run: |
          release_title="$RELEASE_TITLE"
          printf -v release_notes '%s\n\n%s' \
            "手动生成 IPTV 源，文件保存在本次 Release。" \
            "网页同步更新至 iptv.711933.xyz"
          find release-assets -maxdepth 1 -type f -size 0c -delete
          mapfile -d '' local_assets < <(find release-assets -maxdepth 1 -type f -print0 | sort -z)
          gh release create "$RELEASE_TAG" "${local_assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title "$release_title" \
            --notes "$release_notes" \
            --prerelease
          echo "✅ Release 创建&文件上传完成"
