name: Clean All Deployments
on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      deployments: write
      contents: read
    steps:
      - name: Clean deployments
        uses: actions/github-script@v7
        with:
          script: |
            // 直接从 github.context.payload 获取
            const owner = github.context.repo.owner;
            const repo = github.context.repo.repo;
            console.log(`仓库 owner: ${owner}, repo: ${repo}`);

            const deployments = await github.paginate(
              github.rest.repos.listDeployments,
              { owner, repo, per_page: 100 }
            );
            console.log(`找到部署记录总数：${deployments.length}`);

            for (const d of deployments) {
              try {
                await github.rest.repos.createDeploymentStatus({
                  owner,
                  repo,
                  deployment_id: d.id,
                  state: "inactive",
                  description: "cleanup"
                });
                await new Promise(r => setTimeout(r, 600));

                await github.rest.repos.deleteDeployment({
                  owner,
                  repo,
                  deployment_id: d.id
                });
                console.log("✅已删除 deployment id:", d.id);
              } catch (err) {
                console.warn("⚠️删除失败 id=" + d.id, err.message);
              }
            }
