name: Clean All Deployments
on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      deployments: write
      contents: read
    steps:
      - name: Clean deployments
        uses: actions/github-script@v8
        with:
          script: |
            const fullRepo = '${{ github.repository }}';
            const [owner, repo] = fullRepo.split('/');
            console.log(`owner=${owner} repo=${repo}`);

            const deployments = await github.paginate(
              github.rest.repos.listDeployments,
              { owner, repo, per_page: 100 }
            );
            console.log(`部署记录总数: ${deployments.length}`);

            for (const d of deployments) {
              try {
                await github.rest.repos.createDeploymentStatus({
                  owner,
                  repo,
                  deployment_id: d.id,
                  state: "inactive",
                  description: "cleanup"
                });
                await new Promise(r => setTimeout(r, 600));

                await github.rest.repos.deleteDeployment({
                  owner,
                  repo,
                  deployment_id: d.id
                });
                console.log("✅ 删除成功 id:", d.id);
              } catch (e) {
                console.warn("⚠️跳过 id:" + d.id, e.message);
              }
            }
