name: Clean All Deployments
on:
  workflow_dispatch: # 允许手动点击运行

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      deployments: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context;
            const deployments = await github.paginate(github.rest.repos.listDeployments, {owner, repo, per_page:100})
            console.log(`找到部署记录总数：${deployments.length}`)
            for(const d of deployments){
              // 先标记为 inactive，否则无法删除
              await github.rest.repos.createDeploymentStatus({
                owner,repo,deployment_id:d.id,state:"inactive",description:"cleanup"
              })
              await new Promise(r=>setTimeout(r,600))
              // 删除这条部署记录
              await github.rest.repos.deleteDeployment({owner,repo,deployment_id:d.id})
              console.log("已删除 deployment id:",d.id)
            }
